name: Deploy config page to GitHub Pages

# Publishes yemot_hooks_config.html as the site's index.html.
# The page is fully client-side: it talks to the Yemot API directly from the
# browser, and (for interactive hooks) to your own bridge server URL.

on:
  push:
    branches: [main, master]
    paths:
      - yemot_hooks_config.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp yemot_hooks_config.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
